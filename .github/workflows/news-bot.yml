name: Fundamental News Bot

on:
  workflow_dispatch:
  schedule:
   - cron: "2-59/5 * * * *"
permissions:
  contents: write

concurrency:
  group: fundamental-news-bot
  cancel-in-progress: false
  
jobs:
  run-bot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        id: run-bot
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Conserver les décisions et la santé des sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-audit-${{ github.run_id }}
          path: audit/
          retention-days: 7
          if-no-files-found: warn

      - name: Commit updated state
        if: always() && steps.run-bot.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update state.json [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
