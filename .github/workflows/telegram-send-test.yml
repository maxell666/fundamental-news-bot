name: Test ponctuel Telegram

on:
  push:
    branches:
      - codex/test-envoi-telegram-20261024141234
    paths:
      - .github/workflows/telegram-send-test.yml

permissions:
  contents: read

jobs:
  send-test:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Envoyer un seul message de test demandé par l’utilisateur
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          """Envoi ponctuel demandé par l'utilisateur, sans accès aux sources ni à state.json."""

          import json
          import os
          import re
          import sys
          from datetime import datetime
          from urllib import error, parse, request
          from zoneinfo import ZoneInfo


          EXPECTED_BOT = "Annonces_eco_tribal_bot"


          class TestFailure(Exception):
              pass


          def telegram_call(token, method, fields=None):
              data = parse.urlencode(fields or {}).encode("utf-8")
              api_request = request.Request(
                  "https://api.telegram.org/bot" + token + "/" + method,
                  data=data,
                  method="POST",
                  headers={"Content-Type": "application/x-www-form-urlencoded"},
              )
              try:
                  with request.urlopen(api_request, timeout=20) as response:
                      status = response.status
                      body = response.read(65536)
              except error.HTTPError as exc:
                  status = exc.code
                  raise TestFailure(f"Telegram a refusé {method} (HTTP {status}).") from None
              except Exception:
                  raise TestFailure(
                      f"Connexion interrompue pendant {method} ; résultat non confirmé. Aucun nouvel essai automatique."
                  ) from None
              try:
                  payload = json.loads(body)
              except (ValueError, UnicodeError):
                  raise TestFailure("Réponse Telegram illisible ; aucun nouvel essai automatique.") from None
              if status != 200 or not isinstance(payload, dict) or payload.get("ok") is not True:
                  raise TestFailure("Telegram n'a pas confirmé l'opération ; aucun nouvel essai automatique.")
              return payload.get("result")


          def run_test():
              token = os.environ.get("BOT_TOKEN", "").strip()
              chat_id = os.environ.get("CHAT_ID", "").strip()
              if not re.fullmatch(r"[0-9]+:[A-Za-z0-9_-]+", token) or not chat_id:
                  raise TestFailure("Secret Telegram absent ou format incompatible.")

              identity = telegram_call(token, "getMe")
              if not isinstance(identity, dict) or identity.get("is_bot") is not True or identity.get("username") != EXPECTED_BOT:
                  raise TestFailure("Le bot attendu n'a pas été confirmé. Aucun message envoyé.")
              print("Identité confirmée : @" + EXPECTED_BOT)

              date = datetime.now(ZoneInfo("Europe/Paris")).strftime("%d/%m/%Y à %H:%M")
              message = (
                  "🧪 TEST D’ENVOI — Annonces Fondamentales\n\n"
                  "Si tu lis ce message, la réception Telegram fonctionne.\n\n"
                  "Ceci est un test technique demandé par toi, sans actualité ni signal de trading.\n"
                  f"🕒 {date} (heure de Paris)\n"
                  "Référence : AF-TEST-20261024"
              )
              result = telegram_call(token, "sendMessage", {
                  "chat_id": chat_id,
                  "text": message,
                  "disable_web_page_preview": "true",
              })
              if not isinstance(result, dict) or not isinstance(result.get("message_id"), int) or result.get("text") != message:
                  raise TestFailure("Envoi non confirmé par la réponse attendue. Aucun nouvel essai automatique.")
              destination = result.get("chat")
              if not isinstance(destination, dict):
                  raise TestFailure("Destinataire non confirmé. Aucun nouvel essai automatique.")
              if re.fullmatch(r"-?[0-9]+", chat_id):
                  matches = str(destination.get("id")) == str(int(chat_id))
              elif chat_id.startswith("@"):
                  matches = str(destination.get("username", "")).lower() == chat_id[1:].lower()
              else:
                  matches = False
              if not matches:
                  raise TestFailure("La réponse ne confirme pas le destinataire configuré. Aucun nouvel essai automatique.")
              print("Message de test envoyé : Telegram a confirmé le destinataire configuré.")


          def main():
              try:
                  run_test()
              except TestFailure as exc:
                  print(str(exc))
                  return 1
              except Exception:
                  print("Test interrompu ; détails masqués pour protéger les secrets. Aucun nouvel essai automatique.")
                  return 1
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
