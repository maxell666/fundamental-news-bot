name: Vérifier le déclenchement macro

on:
  push:
    branches: [codex/fix-macro-trigger, main]
    paths:
      - scripts/dispatch_macro.py
      - .github/workflows/news-bot.yml
      - .github/workflows/macro-dispatch-check.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  route-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Déclencher seulement le contrôle public sans Telegram
        run: python scripts/dispatch_macro.py --probe-check
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Inspecter le format public de la source
        run: |
          python - <<'PY'
          import json, re
          from macro_watch import public_fetch
          from pmi_release import CHICAGO_SOURCE_URL, _BodyText, inspect_chicago_release, ReleaseParseError
          source = public_fetch(CHICAGO_SOURCE_URL)
          report = {"http_status": source.status, "content_type": (source.headers or {}).get("Content-Type")}
          body = _BodyText()
          body.feed(source.text)
          plain = body.text()
          for match in re.finditer(r"Chicago Business Barometer", plain, re.I):
              fragment = plain[match.start():match.start()+220]
              if re.search(r"\d", fragment):
                  report["headline_sample"] = " ".join(fragment.split()[:20])
                  break
          report["release_markers"] = re.findall(r"\bReleased.{0,45}", plain, re.I)[:2]
          try:
              summary = inspect_chicago_release(source.text)
              report.update(period=summary.period, actual=str(summary.actual))
          except ReleaseParseError as error:
              report["parse_diagnostic"] = str(error)
          print(json.dumps(report, ensure_ascii=True))
          PY
