name: Tests de pertinence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Empreinte de comparaison du token Telegram
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import re
          import sys

          token = os.environ.get("BOT_TOKEN", "").strip()
          if not re.fullmatch(r"[0-9]+:[A-Za-z0-9_-]+", token):
              print("Secret absent ou format incompatible")
              sys.exit(1)
          fingerprint = hashlib.sha256(("fundamental-news-bot:comparaison:v1:" + token).encode("utf-8")).hexdigest()[:12]
          print("Empreinte de comparaison : " + fingerprint)
          PY
      - name: Vérifier l'authentification Telegram sans envoi
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "0"
        run: python -c "from bot import verify_telegram_token; verify_telegram_token()"
