name: Tests de pertinence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Diagnostic Telegram indépendant en lecture seule
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from urllib.parse import urlsplit

          token = os.environ.get("BOT_TOKEN", "").strip()
          if not re.fullmatch(r"[0-9]+:[A-Za-z0-9_-]+", token):
              print("Diagnostic indépendant : secret absent ou format incompatible")
              sys.exit(1)
          success = True
          for method in ("GET", "POST"):
              request = urllib.request.Request(
                  "https://api.telegram.org/bot" + token + "/getMe",
                  data=b"" if method == "POST" else None,
                  method=method,
              )
              try:
                  try:
                      response = urllib.request.urlopen(request, timeout=20)
                  except urllib.error.HTTPError as error:
                      response = error
                  with response:
                      status = response.code
                      host = urlsplit(response.geturl()).hostname
                      body = response.read(65536)
                  try:
                      payload = json.loads(body)
                  except (ValueError, UnicodeError):
                      payload = None
              except Exception:
                  print(method + " : échec réseau (détails masqués)")
                  success = False
                  continue
              is_api_error = isinstance(payload, dict) and payload.get("ok") is False and payload.get("error_code") == status
              unauthorized = is_api_error and payload.get("description") == "Unauthorized"
              print(json.dumps({"method": method, "http_status": status, "official_host": host == "api.telegram.org", "telegram_json_error": is_api_error, "unauthorized": unauthorized}))
              identity = payload.get("result") if isinstance(payload, dict) else None
              username = identity.get("username", "") if isinstance(identity, dict) else ""
              valid = status == 200 and payload.get("ok") is True and identity.get("is_bot") is True and isinstance(username, str) and bool(re.fullmatch(r"[A-Za-z0-9_]{5,32}", username)) if isinstance(identity, dict) else False
              if valid:
                  print("Diagnostic indépendant authentifié : @" + username)
              success = success and valid
          sys.exit(0 if success else 1)
          PY
      - name: Vérifier l'authentification Telegram sans envoi
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "0"
        run: python -c "from bot import verify_telegram_token; verify_telegram_token()"
